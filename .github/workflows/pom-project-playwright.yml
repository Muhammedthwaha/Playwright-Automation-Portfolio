name: Playwright Tests

# 1. When should the robot wake up?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  #  <-- THIS IS THE MAGIC LINE!

jobs:
  test:
    timeout-minutes: 60
    # 2. What operating system should the robot use? (Linux)
    runs-on: ubuntu-latest 
    steps:
      # 4. Download your code from GitHub onto the robot's hard drive
      - uses: actions/checkout@v4

      # 5. Install Node.js on the robot
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # 6. Install your package.json dependencies
      - name: Install dependencies
        run: npm install

      # 7. Cache Playwright Browsers to save download time
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 8. Install Playwright and the browser engines on the robot (will skip downloading if cached!)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 8. Actually run your test suite!
      - name: Run Playwright tests
        run: npx playwright test

      # 9. Save the HTML Report so we can view it later
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
